services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_support
      POSTGRES_USER: secure_support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_support -d secure_support"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - secure-support-db:/var/lib/postgresql/data

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      BOT_MODE: mock
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://secure_support:${POSTGRES_PASSWORD:-local-only-password}@db:5432/secure_support
      COMPANY_ASSIGNMENT_SECRET: ${COMPANY_ASSIGNMENT_SECRET:-}
      CONFIRMATION_HMAC_SECRET: ${CONFIRMATION_HMAC_SECRET:-}

volumes:
  secure-support-db:
